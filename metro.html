<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>台北捷運｜台北基隆生活資訊</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html">
        <p class="eyebrow">Taipei / Keelung</p>
        <h1>生活資訊快覽</h1>
      </a>
      <nav class="section-nav" aria-label="主要頁面">
        <a href="weather.html">天氣</a>
        <a class="active" href="metro.html">捷運</a>
        <a href="bus.html">公車</a>
      </nav>
    </header>

    <main>
      <section class="page-intro" aria-labelledby="metro-page-title">
        <p class="eyebrow">Metro</p>
        <h2 id="metro-page-title">台北捷運</h2>
        <p>使用現有捷運圖，提供可捲動檢視與常用轉乘提醒。</p>
      </section>

      <section class="section compact" aria-labelledby="metro-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Route Map</p>
            <h2 id="metro-title">捷運路線圖</h2>
          </div>
          <a class="plain-link" href="metrotaipeimap_tn.jpg" target="_blank" rel="noreferrer">開啟原圖</a>
        </div>
        <div class="metro-layout">
          <figure class="metro-map large">
            <img src="metrotaipeimap_tn.jpg" alt="台北捷運路線圖" />
          </figure>
          <aside class="metro-panel" aria-label="捷運重點">
            <h3>常用轉乘提醒</h3>
            <ul class="info-list">
              <li><span class="line red">R</span> 淡水信義線可接石牌、士林、台北車站、象山。</li>
              <li><span class="line blue">BL</span> 板南線可接台北車站、市政府、南港展覽館。</li>
              <li><span class="line brown">BR</span> 文湖線可接松山機場、動物園、南港展覽館。</li>
              <li><span class="line green">G</span> 松山新店線可接中山、南京復興、松山。</li>
            </ul>
          </aside>
        </div>
      </section>
    </main>

    <footer>
      <p>捷運即時到站若要加入，下一階段需評估官方 API 申請與金鑰保護。</p>
    </footer>
  </body>
</html>
